notes: >-
  Entity graph derived from the Talkpush API v2.0 OpenAPI paths and component
  schemas. The core domain is a recruiting CRM: Campaigns hold Leads (called
  "campaign invitations"), each Lead wraps a Candidate; AI Agents run Calls and
  Interviews; Messaging is driven by Templates, Quick Replies and Tokens.
entities:
- name: Campaign
  description: A recruiting process / job application container.
  schema: campaign
  paths: ['/campaigns', '/campaigns/{id}']
- name: Lead
  description: A candidate's application to a campaign (a "campaign invitation").
  schema: lead
  paths: ['/campaign_invitations', '/campaign_invitations/{id}']
- name: Candidate
  description: The person applying; embedded within a Lead, carries attributes and labels.
  schema: leads_response_candidates
- name: Folder
  description: A stage/bucket within a campaign or company account.
  schema: folder_body
  paths: ['/company/folders', '/campaigns/{id}/folders']
- name: Agent
  description: An AI calling/interview agent (e.g. ElevenLabs, Vapi provider).
  schema: agent_detail
  paths: ['/agents', '/agents/{id}']
- name: Call
  description: A call record produced by an agent, with transcript and extractions.
  schema: call_body
  paths: ['/calls', '/agents/{agent_id}/calls']
- name: MessageTemplate
  description: A reusable Handlebars message template (email/sms/whatsapp/messenger).
  schema: message_template
  paths: ['/messaging/templates', '/messaging/templates/{id}']
- name: QuickReply
  description: A quick-reply template that can be sent to a lead via a channel.
  schema: quick_reply
  paths: [/messaging/quick_replies, /messaging/messages]
- name: Token
  description: A system or custom token usable inside message-template content.
  schema: token
  paths: [/messaging/tokens]
- name: CandidateAttribute
  description: A default or custom attribute definition on candidates.
  schema: candidate_attribute
  paths: [/company/candidate_attributes]
- name: Label
  description: A company-level label assignable to candidates.
  schema: label
  paths: [/company/labels]
- name: MovementReason
  description: Configured shortlist/reject reasons for moving candidates.
  schema: movement_reason
  paths: [/movement_reasons]
- name: DocumentTag
  description: A document-tag template used when attaching documents to a lead.
  schema: document_tag_body
  paths: [/document_tags]
- name: Manager
  description: A platform user (recruiter/manager) in the company account.
  schema: manager
  paths: [/managers]
