aid: talkpush
name: TalkPush
description: >-
  TalkPush is a conversational recruiting and recruitment-automation CRM that
  helps high-volume employers source, screen, and engage job candidates across
  messaging channels (WhatsApp, SMS, Messenger, email) and AI voice agents. Its
  public REST API — the Talkpush API v2.0 — lets you plug external lead sources
  and HR/ATS technology into the platform: create and search leads (campaign
  invitations), manage recruiting campaigns and folders, run and complete
  interviews, send quick-reply and message templates, configure AI calling
  agents, and manage company labels, candidate attributes, movement reasons, and
  managers. Authentication is via an api_key query parameter, and the docs are
  published on a ReadMe developer hub with an llms.txt index for AI agents.
  Surfaced as a Seedcamp portfolio company and enriched by the API Evangelist
  pipeline from TalkPush's own published developer documentation.
