    Collection of endpoints related to candidate labels. Labels are simple, company-wide tags that recruiters
    use to flag and filter candidates (for example: "Priority", "Referral", "Needs Review"). The same
    labels are visible in the Talkpush UI; anything added via the API immediately appears in the UI and
    on the candidate's `labels` field returned by the Leads API.
