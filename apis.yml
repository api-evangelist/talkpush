- aid: talkpush:talkpush-message-templates-api-api
  name: TalkPush Message Templates API API
  description: >-
    Endpoints for managing Message Templates — the structured, token-based messages used by autoflows
    and integrations for standardised communications (interview invitations, rejection notices, offer
    letters, onboarding instructions). Templates are returned and accepted with content in Handlebars
    format (e.g. `{{candidate_name}}`), regardless of how they are stored internally. Use `GET /messaging/tokens`
    to discover the full list of tokens available in your company.
  humanURL: https://docs.talkpush.com/docs/getting-started
  baseURL: https://your-company.talkpush.com/api/talkpush_services
